<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      @page {
        size: letter;
        margin: 0.75in;
      }
      
      body {
        font-family: 'Montserrat', Arial, sans-serif;
        color: #344767;
        background: white;
        padding: 0;
        margin: 0;
      }
      
      .header {
        text-align: center;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 3px solid #f97316;
      }
      
      .header h2 {
        color: #f97316;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }
      
      .header .date {
        color: #52525b;
        font-size: 0.95rem;
        font-weight: 500;
      }
      
      .recipient {
        margin-bottom: 24px;
        font-size: 0.95rem;
      }
      
      .recipient strong {
        color: #27272a;
        font-weight: 600;
      }
      
      .content {
        margin-top: 20px;
        line-height: 1.7;
        color: #52525b;
        font-size: 0.95rem;
      }
      
      .content p {
        margin-bottom: 12px;
      }
      
      .signature {
        margin-top: 40px;
        padding-top: 24px;
      }
      
      .signature p {
        margin-bottom: 8px;
        color: #52525b;
        font-size: 0.95rem;
      }
      
      .signature p:first-child {
        color: #27272a;
      }
      
      .signature strong {
        color: #27272a;
        font-weight: 600;
      }
      
      .footer {
        color: #8392ab;
        font-size: 0.85rem;
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid #e9ecef;
        text-align: center;
      }
      
      .footer-brand {
        color: #f97316;
        font-weight: 600;
      }
      
      @media print {
        body {
          background: white;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>{{ subject }}</h2>
      <div class="date">{{ date }}</div>
    </div>

    <p class="recipient">Para: <strong>{{ recipient }}</strong></p>

    <div class="content">{{ body|linebreaks }}</div>

    <div class="signature">
      <p>Atentamente,</p>
      <p><strong>{{ user.full_name }}</strong></p>
    </div>

    <div class="footer">
      <span class="footer-brand">Finko</span> - Property Management System
    </div>
  </body>
</html>
